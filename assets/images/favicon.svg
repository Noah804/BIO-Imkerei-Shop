<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="BIO-Imkerei Moser">
  <defs>
    <linearGradient id="honig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4b733"/>
      <stop offset="1" stop-color="#e0930a"/>
    </linearGradient>
  </defs>
  <!-- Wabe (Sechseck) in Markenfarben: Honig mit Almgruen-Rand -->
