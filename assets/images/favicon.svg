  <!-- kleine innere Wabe als Akzent -->
  <polygon points="13,10 19,10 22,16 19,22 13,22 10,16"
           fill="none" stroke="#fffaf2" stroke-width="1.6" stroke-linejoin="round" opacity="0.7"/>
