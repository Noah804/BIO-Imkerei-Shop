<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Einblicke — BIO-Imkerei Moser</title>
  <meta name="description" content="Fotos von unseren Bienen und der Arbeit am Bienenstock — Einblicke in die BIO-Imkerei Moser.">
  <!-- Vorschau beim Teilen des Links (WhatsApp, Facebook & Co.)
       Beim Umstieg auf die eigene Domain: og:image-Adresse anpassen! -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="BIO-Imkerei Moser">
  <meta property="og:title" content="Einblicke — BIO-Imkerei Moser">
  <meta property="og:description" content="Fotos von unseren Bienen und der Arbeit am Bienenstock — Einblicke in die BIO-Imkerei Moser.">
  <meta property="og:image" content="https://noah804.github.io/BIO-Imkerei-Shop/assets/images/biene_blume.jpg">
  <meta property="og:locale" content="de_AT">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container inhalt" style="max-width:1000px">
    <h1>Einblicke in unsere Imkerei</h1>
    <p>Hier zeigen wir dir, wie es bei uns zugeht — von den Bienenvölkern
       über die Honigernte bis zum fertigen Glas. Schau dich um!</p>

    <!-- Kategorie-Filter (per JavaScript gefüllt) -->
    <div id="galerieFilter" style="display:flex;gap:.5rem;flex-wrap:wrap;margin:1.5rem 0"></div>

    <div class="galerie-raster" id="galerie">
      <!-- wird per JavaScript aus js/galerie.js gefüllt -->
    </div>
  </main>

  <!-- Großansicht (Lightbox) -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Großansicht">
    <button class="lightbox__schliessen" id="lightboxSchliessen" aria-label="Schließen">&times;</button>
    <img id="lightboxBild" src="" alt="">
    <p class="lightbox__text" id="lightboxText"></p>
  </div>

  <script src="js/main.js"></script>
  <script src="js/galerie.js"></script>
  <script>
    (function () {
      const ziel = document.getElementById("galerie");
      const filterEl = document.getElementById("galerieFilter");
      if (!ziel || typeof GALERIE === "undefined") return;
      const PLATZHALTER = "assets/images/platzhalter.svg";

      /* ----- Kategorie-Filter ----- */
      // "Alle" + jede Kategorie in der Reihenfolge, in der sie
      // in js/galerie.js zum ersten Mal vorkommt.
      let aktiveKategorie = "Alle";
      const kategorien = ["Alle"];
      GALERIE.forEach(function (foto) {
        if (foto.kategorie && !kategorien.includes(foto.kategorie)) {
          kategorien.push(foto.kategorie);
        }
      });

      function baueFilter() {
        if (!filterEl) return;
        filterEl.innerHTML = kategorien.map(function (k) {
          const aktiv = k === aktiveKategorie ? "" : " btn--umriss";
          return `<button class="btn${aktiv}" onclick="setzeGalerieKategorie('${k}')">${k}</button>`;
        }).join("");
      }

      function zeigeFotos() {
        const gefiltert = aktiveKategorie === "Alle"
          ? GALERIE
          : GALERIE.filter(function (f) { return f.kategorie === aktiveKategorie; });
        ziel.innerHTML = gefiltert.map(function (foto) {
          const bild = foto.bild || PLATZHALTER;
          const titel = foto.titel || "";
          return `
            <figure class="galerie-bild">
              <img src="${bild}" alt="${titel || 'Foto aus der Imkerei'}" loading="lazy"
                   onerror="this.src='${PLATZHALTER}'">
              ${titel ? `<figcaption>${titel}</figcaption>` : ""}
            </figure>`;
        }).join("");
      }

      // global, damit die Knöpfe per onclick zugreifen können
      window.setzeGalerieKategorie = function (k) {
        aktiveKategorie = k;
        baueFilter();
        zeigeFotos();
      };

      baueFilter();
      zeigeFotos();

      // ----- Großansicht (Lightbox) -----
      const box = document.getElementById("lightbox");
      const boxBild = document.getElementById("lightboxBild");
      const boxText = document.getElementById("lightboxText");
      const boxZu = document.getElementById("lightboxSchliessen");

      let zuletztFokussiert = null; // für die Tastatur: Fokus nachher zurückgeben

      function oeffne(bild, titel) {
        zuletztFokussiert = document.activeElement;
        boxBild.src = bild;
        boxBild.alt = titel || "Foto aus der Imkerei";
        boxText.textContent = titel || "";
        box.classList.add("offen");
        document.body.style.overflow = "hidden"; // Hintergrund nicht scrollen
        boxZu.focus(); // Fokus in die Großansicht holen (Schließen-Knopf)
      }
      function schliesse() {
        box.classList.remove("offen");
        boxBild.src = "";
        document.body.style.overflow = "";
        // Fokus dorthin zurückgeben, wo er vor dem Öffnen war
        if (zuletztFokussiert && zuletztFokussiert.focus) zuletztFokussiert.focus();
      }

      // Klick auf ein Galerie-Bild öffnet die Großansicht
      ziel.addEventListener("click", function (e) {
        const img = e.target.closest(".galerie-bild img");
        if (!img) return;
        const figur = img.closest(".galerie-bild");
        const caption = figur.querySelector("figcaption");
        oeffne(img.src, caption ? caption.textContent : "");
      });

      // Schließen: Klick daneben, X-Knopf oder Esc-Taste
      box.addEventListener("click", function (e) {
        if (e.target !== boxBild) schliesse();
      });
      boxZu.addEventListener("click", schliesse);
      document.addEventListener("keydown", function (e) {
        if (!box.classList.contains("offen")) return;
        if (e.key === "Escape") schliesse();
        // Tab bleibt in der Großansicht (einziges Bedienelement: Schließen-Knopf)
        if (e.key === "Tab") { e.preventDefault(); boxZu.focus(); }
      });
    })();
  </script>
</body>
</html>
